name: macOS checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      PYTHONNOUSERSITE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13.7'
          check-latest: false
      - name: Verify pinned toolchain
        run: |
          python - <<'PY'
          import re, subprocess, sys
          assert sys.version_info[:3] == (3, 13, 7), sys.version
          version = subprocess.check_output(['swiftc', '--version'], text=True)
          print(version)
          assert re.search(r'Apple Swift version 6\.1\.2\b', version), version
          PY
          xcodebuild -version
      - name: Install Python dependencies
        working-directory: mac
        run: python -m pip install --disable-pip-version-check -e .
      - name: Mac unit tests
        working-directory: mac
        run: python -m unittest tests.test_listener tests.test_desk -v
      - name: Build native Mac bundle
        run: mac/Tools/build-window.sh "$RUNNER_TEMP/Letterbox Desk.app"
      - name: iOS crypto and event checks
        run: ios/Tools/check-vectors.sh
      - name: iOS transcript checks
        run: ios/Tools/check-transcript.sh
